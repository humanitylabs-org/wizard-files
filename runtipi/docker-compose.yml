services:
  wizard-files:
    build:
      context: .
      dockerfile: Dockerfile
    # Thumbnail cache writes need the root-owned App Manager data bind.
    user: "0:0"
    environment:
      FILES_ROOT: /files
      FILES_ALLOWED_HOSTS: ${FILES_ALLOWED_HOSTS:-}
      # The box's own address, written by the App Manager at install/update (no owner form needed).
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      FILES_APP_DATA_PREFIXES: ${FILES_APP_DATA_PREFIXES:-[]}
      # Browser boundary (default off): written by the App Manager only when the box turns it on.
      WIZARD_BROWSER_BOUNDARY: ${WIZARD_BROWSER_BOUNDARY:-}
      WIZARD_APP_CREDENTIAL: ${WIZARD_APP_CREDENTIAL:-}
    volumes:
      - ${ROOT_FOLDER_HOST}/media:/files:ro
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:size=16m,noexec,nosuid,nodev']
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
  overrides: []
